<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prism Break</title>
<style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 30% 0%,#26214a,#10101c 55%);color:#f4f0ff;font:15px system-ui,sans-serif;min-height:100dvh}main{width:min(100% - 24px,440px);margin:auto;padding:16px 0}header{display:flex;justify-content:space-between;align-items:end;margin-bottom:12px}h1{font-size:clamp(23px,7vw,34px);line-height:1;margin:4px 0 0;letter-spacing:-.07em}.stats{display:flex;gap:clamp(6px,2vw,14px);text-align:right;color:#c7bbdf;font-size:11px}.stats #crystals{color:#a4e6ff}.stats strong{display:block;color:white;font-size:20px}.turn-stats{display:flex;justify-content:center;gap:16px;margin:9px auto 0;font-size:11px;color:#d7c8ef;font-variant-numeric:tabular-nums}.turn-stats strong{color:#fff2ce}.stage{position:relative;overflow:hidden;border-radius:20px;border:1px solid #585075;background:#171526;box-shadow:0 14px 50px #080711; width:min(100%,calc((100dvh - 200px) * 2 / 3));min-width:min(100%,260px);margin:auto}canvas{width:100%;height:auto;display:block;touch-action:none}.overlay{position:absolute;inset:0;background:#171327ed;display:grid;place-content:center;padding:18px;text-align:center}.overlay[hidden]{display:none}.overlay h2{margin:0 0 6px;font-size:24px}.overlay p{margin:0 0 12px;color:#d5c9ef}.options{display:grid;gap:7px}button{background:#28233d;color:#f5efff;border:1px solid #635683;border-radius:10px;padding:9px 12px;font:inherit;cursor:pointer}button:hover,button[aria-pressed=true]{background:#4c3c74}button:disabled{opacity:.4;cursor:default}button strong,button small{display:block}button small{color:#d2c8eb;margin-top:2px}.toolbar{display:flex;gap:8px;justify-content:center;margin-top:10px}#hint{text-align:center;color:#d0c4e6;font-size:12px;margin:8px 0 0;min-height:2em}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
<main>
<header><div><h1>PRISM BREAK</h1></div><div class="stats"><div>Волна<strong id="wave">1</strong></div><div>Рекорд<strong id="best">0</strong></div><div>Кристаллы<strong id="crystals">0</strong></div></div></header>
<div class="stage">
<canvas id="board" width="420" height="630" aria-label="Игровое поле Prism Break"></canvas>
<div class="overlay" id="overlay" hidden><div><h2 id="heading"></h2><p id="description"></p><div class="options" id="options"></div></div></div>
</div>
<div class="turn-stats" aria-label="Результат залпа"><span>Урон <strong id="damage">0</strong></span><span>Разбито <strong id="broken">0</strong></span><span>Бонус <strong id="bonus">+0</strong></span><span>Чекпоинт <strong id="checkpoint">—</strong></span></div>
<div class="toolbar"><button id="return" disabled>Вернуть шары</button><button id="fast" aria-pressed="false">Скорость ×2</button></div>
<p id="hint" role="status"></p>
</main>
<script>
'use strict';
const $ = id => document.getElementById(id);
const board = $('board'), ctx = board.getContext('2d');
const W=420,H=630,FLOOR=586,TOP=42,COLS=7,CELL=60,ROW=49,R=5;
const brickColors=['#bd98ff','#74e8da','#ffc276','#ff8eb1','#90b8ff'];
function brickColor(hp){return brickColors[(hp-1)%brickColors.length];}
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
let best=0;
try {best=Math.max(0,Number(localStorage.getItem('prism-break-best'))||0)} catch {}
const REVIVE_COST=5;
const CRYSTAL_KEY='prism-break-crystals';
const RUN_KEY='prism-break-run-v1';
let crystals=0, revives=0, gems, collectedGems, checkpoint;
const GEM_VALUE=1;
const GEM_WAVE_INTERVAL=3;
const CHECKPOINT_INTERVAL=5;
const TUTORIAL_ROWS={
  1:[[0,1,5],[0,5,6]],
  2:[[1,0,2]],
  3:[[0,4,6]]
};
const TUTORIAL_HINTS={
  1:'Потяни по полю и отпусти. Попробуй направить шары в боковую стену.',
  2:'Разбей блок ✦ — он нанесёт 2 урона соседям.',
  3:'Направь шар в бирюзовый ромб, чтобы подобрать кристалл.',
  6:'Треугольник меняет угол отскока. Посмотри на голубой пунктир.'
};
try {
  const saved=Number(localStorage.getItem(CRYSTAL_KEY));
  if(Number.isSafeInteger(saved)&&saved>=0)crystals=saved;
} catch {}
let mode, wave, bricks, balls, sparks, origin, target, pointer, pending, gap, velocity, elapsed, landing, stock, power, rewardTurn, shotDamage, broken, nextBonus, fast=false;
let beforeShot=null;
function captureRun(){
  return {mode,wave,bricks:bricks.map(b=>({...b})),gems:gems.map(g=>({...g})),
    origin,stock,power,rewardTurn,shotDamage,broken,nextBonus,fast,checkpoint,revives};
}
function saveRun(){
  if(mode==='paused')return;
  const run=mode==='shot'?beforeShot:captureRun();
  if(!run)return;
  try{
    localStorage.setItem(RUN_KEY,JSON.stringify({...run,fast,crystals,collectedGems:[...collectedGems]}));
  }catch{}
}
function restoreRun(){
  let run;
  try{run=JSON.parse(localStorage.getItem(RUN_KEY));}catch{return false;}
  if(!run||!['aim','choice','over'].includes(run.mode)||
    !Number.isSafeInteger(run.wave)||run.wave<1||
    !Array.isArray(run.bricks)||!Array.isArray(run.gems)||!Array.isArray(run.collectedGems)||
    !Number.isSafeInteger(run.crystals)||run.crystals<0)return false;
  ({mode,wave,bricks,gems,origin,stock,power,rewardTurn,shotDamage,broken,nextBonus,fast,checkpoint,revives,crystals}=run);
  collectedGems=new Set(run.collectedGems);
  gems=gems.filter(gem=>!collectedGems.has(gem.id));
  balls=[];sparks=[];target=null;pointer=null;elapsed=0;pending=0;
  return true;
}
const clamp=(v,a,b)=>Math.max(a,Math.min(v,b));
function spawn(row){
  const order=Array.from({length:COLS},(_,i)=>i);
  for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];}
  const count=Math.min(6,3+Math.floor(wave/4));
  const tutorialRow=TUTORIAL_ROWS[wave]?.[row];
  const blockColumns=tutorialRow??order.slice(0,count);
  blockColumns.forEach((col,index)=>{
    const relay=wave>=2 && index===0 && wave%2===0;
    const hp=tutorialRow?wave+(relay?0:1):Math.ceil(wave*.95)+Math.floor(Math.random()*3)+1;
    const slope=wave>=6&&index===1?(wave%2===0?1:-1):0;
    bricks.push({col,row,hp,relay,slope});
  });
  if(row===0&&wave%GEM_WAVE_INTERVAL===0){
    const id=wave+':0:0';
    if(!collectedGems.has(id))gems.push({id,col:tutorialRow?3:order[count],row});
  }
  if(row===0&&wave>=8&&wave%6===2){
    const id='prism:'+wave;
    gems.push({id,col:order[count],row,prism:true});
  }
}
function gemPosition(gem){
  return {x:(gem.col+.5)*CELL,y:TOP+gem.row*ROW+ROW/2-4};
}
function shotStats(){
  $('damage').textContent=shotDamage;
  $('broken').textContent=broken;
  $('bonus').textContent='+'+nextBonus;
}
function hud(){
  shotStats();
  $('crystals').textContent=crystals;
  $('checkpoint').textContent=checkpoint?.wave??'—';
  $('wave').textContent=wave;$('best').textContent=best;
  $('return').disabled=mode!=='shot'||elapsed<.5;
  $('fast').setAttribute('aria-pressed',String(fast));
  const pickupHint=gems.some(gem=>gem.prism)?'Розовая призма раздваивает шар в полёте.':'';
  const messages={paused:'',aim:(TUTORIAL_HINTS[wave]??(pickupHint||'Потяни и отпусти для выстрела'))+' · Шаров: '+(stock+nextBonus),shot:pickupHint||'Попади шаром в кристалл, чтобы получить +'+GEM_VALUE,choice:'Усиление действует до конца партии',over:'Рекорд сохраняется в этом браузере'};
  if($('hint').textContent!==messages[mode]) $('hint').textContent=messages[mode];
}
function reset(){
  gems=[];collectedGems=new Set();checkpoint=null;
  revives=0;mode='aim';wave=1;bricks=[];balls=[];sparks=[];origin=W/2;target=null;pointer=null;stock=5;power=1;rewardTurn=0;fast=false;elapsed=0;pending=0;shotDamage=0;broken=0;nextBonus=0;
  spawn(0);spawn(1);$('overlay').hidden=true;hud();saveRun();
}
function rect(b){return {x:b.col*CELL+5,y:TOP+b.row*ROW,w:CELL-10,h:ROW-8};}
function direction(){
  const dx=target.x-origin,dy=Math.min(-21,target.y-FLOOR);
  const angle=clamp(Math.atan2(dx,-dy),-1.32,1.32);
  return {x:Math.sin(angle),y:-Math.cos(angle)};
}
function launch(){
  beforeShot=captureRun();
  velocity=direction();mode='shot';pending=stock+nextBonus;
  gap=0;elapsed=0;landing=null;balls=[];target=null;
  shotDamage=0;broken=0;nextBonus=0;hud();
}
function burst(x,y,c){
  if(reduced)return;
  for(let i=0;i<10;i++){const a=Math.random()*Math.PI*2,s=35+Math.random()*135;sparks.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.22+Math.random()*.23,c});}
}
function damage(b,amount){
  if(b.hp<=0)return;
  const dealt=Math.min(amount,b.hp);
  b.hp-=dealt;
  b.flash=.13;
  if(mode==='shot'){
    shotDamage+=dealt;
    if(b.hp===0){
      broken++;
      nextBonus=Math.min(4,Math.floor(broken/3));
    }
    shotStats();
  }
  if(b.hp>0)return;
  const r=rect(b);burst(r.x+r.w/2,r.y+r.h/2,brickColor(dealt));
  if(b.relay) for(const next of bricks) if(Math.abs(next.col-b.col)+Math.abs(next.row-b.row)===1) damage(next,2);
}
function modal(title,description,items){
  $('heading').textContent=title;$('description').textContent=description;$('options').replaceChildren();
  for(const [label,detail,action,disabled=false] of items){
    const button=document.createElement('button'), strong=document.createElement('strong'), small=document.createElement('small');
    strong.textContent=label;small.textContent=detail;button.append(strong,small);button.onclick=action;button.disabled=disabled;$('options').append(button);
  }
  $('overlay').hidden=false;$('options').querySelector('button:not(:disabled)')?.focus();
}
function finish(){
  if(mode!=='shot')return;
  origin=landing??origin;balls=[];pending=0;
  if(wave>best){
    best=wave;
    try {localStorage.setItem('prism-break-best',String(best))} catch {}
  }
  for(const b of bricks)b.row++;
  for(const gem of gems)gem.row++;
  gems=gems.filter(gem=>gemPosition(gem).y+10<FLOOR);
  if(bricks.some(blockAtFloor)){
    mode='over';
    showGameOver();
    hud();saveRun();
    return;
  }
  nextWave();
}
function showGameOver(){
  const cost=reviveCost();
  const detail=crystals>=cost?'Убирает блоки у линии запуска':'Не хватает кристаллов: '+(cost-crystals);
  const items=[['Продолжить · '+cost+' кр.',detail,()=>revive(false),crystals<cost]];
  if(checkpoint)items.push(['К чекпоинту · '+cost+' кр.', 'Восстановить поле волны '+checkpoint.wave,()=>revive(true),crystals<cost]);
  items.push(['Новая партия','',reset]);
  modal('Поле заполнено','Достигнута волна '+wave,items);
}
function blockAtFloor(brick){
  const bounds=rect(brick);
  return bounds.y+bounds.h>=FLOOR-15;
}
function reviveCost(){return REVIVE_COST*(revives+1);}
function saveCheckpoint(){
  if(wave%CHECKPOINT_INTERVAL!==0||checkpoint?.wave===wave)return;
  checkpoint={wave,bricks:bricks.map(b=>({...b})),gems:gems.map(g=>({...g})),origin,stock,power,rewardTurn,nextBonus};
}
function revive(fromCheckpoint){
  if(fromCheckpoint&&!checkpoint)return;
  const cost=reviveCost();
  if(mode!=='over'||crystals<cost)return;
  crystals-=cost;
  revives++;
  $('overlay').hidden=true;
  if(fromCheckpoint){
    ({wave,origin,stock,power,rewardTurn,nextBonus}=checkpoint);
    bricks=checkpoint.bricks.map(b=>({...b}));
    gems=checkpoint.gems.filter(g=>!collectedGems.has(g.id)).map(g=>({...g}));
    shotDamage=0;broken=0;sparks=[];mode='aim';
    hud();saveRun();
    return;
  }
  bricks=bricks.filter(brick=>!blockAtFloor(brick));
  nextWave();
}
function nextWave(){
  wave++;spawn(0);mode='aim';
  if(wave%3===1 && rewardTurn!==wave){
    rewardTurn=wave;mode='choice';
    showUpgradeChoice();
  }else saveCheckpoint();
  hud();saveRun();
}
function showUpgradeChoice(){
  const apply=effect=>()=>{effect();mode='aim';$('overlay').hidden=true;saveCheckpoint();hud();saveRun();};
  const clear=()=>{const bottom=Math.max(...bricks.map(b=>b.row));for(const b of bricks)if(b.row===bottom)damage(b,b.hp);bricks=bricks.filter(b=>b.hp>0);};
  const items=[['Импульс','+1 к урону каждого шара',apply(()=>power++)],['Разряд','Разрушает ближайший к линии запуска ряд',apply(clear)]];
  if(stock<60) items.unshift(['Двойной залп','+2 шара',apply(()=>stock=Math.min(60,stock+2))]);
  modal('Выбери усиление','Волна '+wave,items);
}
function triangleBounce(ball,oldX,oldY,bounds,slope){
  const {x,y,w,h}=bounds;
  const edgeX=slope===1?x:x+w;
  const diagonal=Math.hypot(w,h);
  // Each plane has an outward unit normal and a point on its edge.
  const planes=[
    [-slope,0,edgeX,y],
    [0,1,edgeX,y+h],
    [slope*h/diagonal,-w/diagonal,edgeX,y]
  ];
  let entry=-Infinity;
  let hitNormal=null;
  for(const [nx,ny,px,py] of planes){
    const distance=(ball.x-px)*nx+(ball.y-py)*ny-R;
    if(distance>0)return false;
    const previous=(oldX-px)*nx+(oldY-py)*ny-R;
    const approach=previous-distance;
    if(approach<=0)continue;
    const time=previous/approach;
    if(time>entry){entry=time;hitNormal=[nx,ny];}
  }
  if(!hitNormal||entry<0)return false;
  const [nx,ny]=hitNormal;
  const speedAlongNormal=ball.vx*nx+ball.vy*ny;
  if(speedAlongNormal>=0)return false;
  ball.x=oldX;ball.y=oldY;
  ball.vx-=2*speedAlongNormal*nx;
  ball.vy-=2*speedAlongNormal*ny;
  return true;
}
function moveBall(b,dt){
  const ox=b.x,oy=b.y;b.x+=b.vx*dt;b.y+=b.vy*dt;
  if(b.x<R||b.x>W-R){b.x=clamp(b.x,R,W-R);b.vx=-b.vx;}
  if(b.y<R){b.y=R;b.vy=Math.abs(b.vy);}
  if(b.y>=FLOOR && b.vy>0)return null;
  for(const tile of bricks){
    if(tile.hp<=0)continue;
    const r=rect(tile);
    if(b.x<r.x-R||b.x>r.x+r.w+R||b.y<r.y-R||b.y>r.y+r.h+R)continue;
    if(tile.slope){
      if(triangleBounce(b,ox,oy,r,tile.slope))return tile;
      continue;
    }
    const xSide=ox<=r.x-R||ox>=r.x+r.w+R;
    b.x=ox;b.y=oy;
    if(xSide)b.vx=-b.vx;else b.vy=-b.vy;
    return tile;
  }
  return null;
}
function stepBall(b,dt,splitBalls){
  const tile=moveBall(b,dt);
  if(b.y>=FLOOR&&b.vy>0){landing??=b.x;return false;}
  if(tile)damage(tile,power);
  const gemIndex=gems.findIndex(gem=>{
    const {x,y}=gemPosition(gem);
    return (b.x-x)**2+(b.y-y)**2<=(R+10)**2;
  });
  if(gemIndex!==-1){
    const [gem]=gems.splice(gemIndex,1);
    const {x,y}=gemPosition(gem);
    if(gem.prism){
      const angle=Math.atan2(b.vy,b.vx);
      const speed=Math.hypot(b.vx,b.vy);
      const spread=Math.PI/12;
      splitBalls.push({...b,vx:Math.cos(angle+spread)*speed,vy:Math.sin(angle+spread)*speed});
      b.vx=Math.cos(angle-spread)*speed;
      b.vy=Math.sin(angle-spread)*speed;
      burst(x,y,'#ff8edb');
    }else{
      collectedGems.add(gem.id);
      crystals+=GEM_VALUE;
      $('crystals').textContent=crystals;
      burst(x,y,'#77f4e9');
    }
    saveRun();
  }
  return true;
}
function update(dt){
  for(const p of sparks){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;}
  sparks=sparks.filter(p=>p.life>0);
  for(const b of bricks) b.flash=Math.max(0,(b.flash||0)-dt);
  if(mode!=='shot')return;
  const speed=fast?2:1, steps=Math.max(1,Math.ceil(dt*speed*240)), slice=dt*speed/steps;
  for(let i=0;i<steps&&mode==='shot';i++){
    elapsed+=slice;gap-=slice;
    if(pending>0&&gap<=0){balls.push({x:origin,y:FLOOR,vx:velocity.x*500,vy:velocity.y*500});pending--;gap+=.062;}
    const splitBalls=[];
    balls=balls.filter(b=>stepBall(b,slice,splitBalls));
    balls.push(...splitBalls);
    bricks=bricks.filter(b=>b.hp>0);
    if((!pending&&!balls.length)||elapsed>15)finish();
  }
  $('return').disabled=mode!=='shot'||elapsed<.5;
}
function dot(x,y,r,fill){ctx.fillStyle=fill;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();}
function drawBall(x,y){
  const light=ctx.createRadialGradient(x-1.7,y-2,.2,x,y,R);
  light.addColorStop(0,'#f7feff');
  light.addColorStop(.45,'#a4e6ff');
  light.addColorStop(1,'#4389cb');
  dot(x,y,R,light);
  ctx.strokeStyle='#c1edff';
  ctx.stroke();
}
function line(y,color){ctx.strokeStyle=color;ctx.beginPath();ctx.moveTo(10,y);ctx.lineTo(W-10,y);ctx.stroke();}
const touchAim=matchMedia('(any-pointer: coarse)');
function drawAim(){
  const d=direction();
  const b={x:origin,y:FLOOR,vx:d.x*500,vy:d.y*500};
  let bounceStep=-1;
  for(let step=1;step<=420;step++){
    const tile=moveBall(b,1/240);
    if(b.y>=FLOOR&&b.vy>0)break;
    if(tile){
      if(bounceStep!==-1)break;
      bounceStep=step;
      dot(b.x,b.y,touchAim.matches?4:3,'#b9ffff');
    }
    if(step%6===0){
      const color=bounceStep===-1?'#f1e6ffd9':'#84ebffd9';
      dot(b.x,b.y,touchAim.matches?3:2,color);
    }
    if(bounceStep!==-1&&step-bounceStep>=60)break;
  }
}
function draw(){
  const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#282241');bg.addColorStop(1,'#151326');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  for(let x=12;x<W;x+=20)for(let y=14;y<H;y+=20)dot(x,y,1,'#ffffff13');
  line(FLOOR+12,'#bc9bff7a');
  for(const b of bricks){
    const r=rect(b), fill=ctx.createLinearGradient(r.x,r.y,r.x,r.y+r.h);
    const color=brickColor(b.hp);
    fill.addColorStop(0,color);fill.addColorStop(1,color+'bc');
    ctx.fillStyle=fill;ctx.shadowColor=color;ctx.shadowBlur=11;
    ctx.beginPath();
    if(b.slope){
      const edgeX=b.slope===1?r.x:r.x+r.w;
      const tipX=edgeX+b.slope*r.w;
      const bottom=r.y+r.h;
      ctx.moveTo((edgeX+tipX)/2,(r.y+bottom)/2);
      ctx.arcTo(tipX,bottom,edgeX,bottom,5);
      ctx.arcTo(edgeX,bottom,edgeX,r.y,7);
      ctx.arcTo(edgeX,r.y,tipX,bottom,5);
      ctx.closePath();
    }else ctx.roundRect(r.x,r.y,r.w,r.h,9);
    ctx.fill();ctx.shadowBlur=0;
    ctx.strokeStyle='#ffffff65';ctx.stroke();
    if(b.flash>0&&!reduced){ctx.fillStyle='rgba(255,255,255,'+(b.flash*4)+')';ctx.fill();}
    if(b.slope){
      const edgeX=b.slope===1?r.x:r.x+r.w;
      ctx.beginPath();
      ctx.moveTo(edgeX+b.slope*r.w*.24,r.y+r.h*.24+3);
      ctx.lineTo(edgeX+b.slope*r.w*.74,r.y+r.h*.74+3);
      ctx.strokeStyle='#ffffff85';
      ctx.lineWidth=1.5;
      ctx.stroke();
      ctx.lineWidth=1;
    }
    ctx.fillStyle='#1c142d';ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='800 19px system-ui';ctx.fillText(b.hp,r.x+r.w*(.5-(b.slope||0)/6),r.y+r.h*(b.slope?2/3:.5));
    if(b.relay){
      ctx.font='bold 12px system-ui';ctx.fillText('✦',r.x+9,r.y+9);
    }
  }
  for(const gem of gems){
    const {x,y}=gemPosition(gem);
    if(gem.prism){
      const fill=ctx.createLinearGradient(x,y-11,x,y+11);
      fill.addColorStop(0,'#cd72db');fill.addColorStop(1,'#773484');
      ctx.fillStyle=fill;ctx.strokeStyle='#ffb9ed';
      ctx.beginPath();ctx.roundRect(x-13,y-9,26,18,7);ctx.fill();ctx.stroke();
      dot(x-5,y,3.2,'#fff0ff');
      dot(x+5,y,3.2,'#fff0ff');
      continue;
    }
    ctx.fillStyle='#77f4e9';ctx.strokeStyle='#e0fffc';
    ctx.beginPath();ctx.moveTo(x,y-11);ctx.lineTo(x+8,y);
    ctx.lineTo(x,y+11);ctx.lineTo(x-8,y);ctx.closePath();ctx.fill();ctx.stroke();
    dot(x-2,y-3,2,'#edffff');
  }
  if(target&&mode==='aim')drawAim();
  for(const p of sparks){ctx.globalAlpha=clamp(p.life*3,0,1);dot(p.x,p.y,2.4,p.c);}
  ctx.globalAlpha=1;
  for(const b of balls){
    if(!reduced){
      const length=Math.min(11,Math.hypot(b.x-origin,b.y-FLOOR));
      ctx.strokeStyle='#84d9ff55';
      ctx.lineWidth=1.5;
      ctx.beginPath();
      ctx.moveTo(b.x,b.y);
      ctx.lineTo(b.x-b.vx/500*length,b.y-b.vy/500*length);
      ctx.stroke();
      ctx.lineWidth=1;
    }
    drawBall(b.x,b.y);
  }
  if(mode==='aim'||pending>0){
    ctx.strokeStyle='#8dd8ff65';
    ctx.beginPath();
    ctx.arc(origin,FLOOR,10,0,Math.PI*2);
    ctx.stroke();
    drawBall(origin,FLOOR);
  }
}
function aim(e){
  const r=board.getBoundingClientRect();
  target={x:clamp((e.clientX-r.left)*W/r.width,0,W),y:clamp((e.clientY-r.top)*H/r.height,0,H)};
}
board.addEventListener('pointerdown',e=>{
  if(mode!=='aim'||pointer!==null||e.button!==0)return;
  aim(e);if(target.y>FLOOR+12){target=null;return;}
  pointer=e.pointerId;board.setPointerCapture(pointer);
});
board.addEventListener('pointermove',e=>{if(e.pointerId===pointer)aim(e);});
board.addEventListener('pointerup',e=>{
  if(e.pointerId!==pointer)return;
  pointer=null;aim(e);
  if(target.y<FLOOR-12)launch();else target=null;
});
for(const event of ['pointercancel','lostpointercapture'])board.addEventListener(event,e=>{if(e.pointerId===pointer){pointer=null;target=null;}});
$('return').onclick=finish;
$('fast').onclick=()=>{fast=!fast;hud();saveRun();};
if(restoreRun()){
  hud();
  // Block input while the game waits for the player to resume.
  const restoredMode=mode;
  mode='paused';
  modal('Партия сохранена','Волна '+wave,[['Продолжить партию','',()=>{
    mode=restoredMode;
    $('overlay').hidden=true;
    if(mode==='choice')showUpgradeChoice();
    if(mode==='over')showGameOver();
    hud();
  }]]);
}else reset();
let previous=performance.now();
function frame(now){update(Math.min(.035,(now-previous)/1000));previous=now;draw();requestAnimationFrame(frame);}
requestAnimationFrame(frame);
</script>
